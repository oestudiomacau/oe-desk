<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OE DESK AI 客服在线咨询">
    <title>OE DESK · 在线咨询</title>
  <style>
    :root{color-scheme:light;--ink:#18201d;--muted:#6d7772;--line:#dfe7e1;--paper:#f3f7f3;--panel:#fff;--accent:#1c8060;--accent-dark:#125e46;--accent-soft:#e8f6ef;--user:#1c8060;--shadow:0 22px 60px rgba(35,65,48,.12)}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{color:var(--ink);background:linear-gradient(145deg,#eef7f0 0%,#f7faf7 52%,#e8f3ec 100%);font:15px/1.6 "Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
    button,input,textarea{font:inherit}button{cursor:pointer}.shell{width:min(960px,calc(100% - 28px));min-height:100vh;margin:auto;padding:28px 0;display:flex;align-items:center}.app{width:100%;height:min(820px,calc(100vh - 56px));min-height:620px;display:grid;grid-template-rows:auto 1fr auto;border:1px solid rgba(255,255,255,.8);border-radius:24px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94)}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;color:#fff;background:var(--ink);font-size:13px;font-weight:800;letter-spacing:.6px}.brand strong{display:block;font-size:16px;letter-spacing:.2px}.brand span{display:block;color:var(--muted);font-size:11px}.header-note{color:var(--muted);font-size:12px;text-align:right}.header-note b{display:block;color:var(--accent-dark);font-size:13px}
    .messages{padding:28px clamp(17px,5vw,58px);overflow:auto;background:var(--paper)}.welcome{max-width:590px;margin:16px auto 32px;padding:25px 26px;border:1px solid #d5eadb;border-radius:17px;background:linear-gradient(135deg,#fff 0%,#f3fbf5 100%);text-align:center}.welcome h1{margin:0;font-size:25px;line-height:1.25}.welcome p{margin:10px 0 0;color:var(--muted);font-size:13px}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:17px}.chip{padding:6px 11px;border:1px solid #cfe4d5;border-radius:999px;color:var(--accent-dark);background:#fff;font-size:12px}.message{display:flex;gap:10px;max-width:710px;margin:0 auto 18px}.message.user{justify-content:flex-end}.avatar{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:50%;color:#fff;background:var(--accent);font-size:10px;font-weight:800}.message.user .avatar{order:2;background:var(--ink)}.bubble{max-width:min(650px,78vw);padding:11px 14px;border:1px solid var(--line);border-radius:5px 15px 15px 15px;background:#fff;box-shadow:0 4px 12px rgba(45,70,53,.04);white-space:pre-wrap;overflow-wrap:anywhere}.message.user .bubble{border:0;border-radius:15px 5px 15px 15px;color:#fff;background:var(--user)}.meta{margin:0 0 4px;color:var(--muted);font-size:10px}.message.user .meta{text-align:right}.typing{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:12px}.typing i{width:5px;height:5px;border-radius:50%;background:#90aa9c;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
    .composer{padding:15px 20px 18px;border-top:1px solid var(--line);background:#fff}.composer-row{display:flex;gap:9px;max-width:760px;margin:auto}.composer textarea{width:100%;min-height:48px;max-height:130px;resize:none;padding:11px 13px;border:1px solid #cddbd1;border-radius:13px;outline:0;color:var(--ink);background:#fbfdfb}.composer textarea:focus{border-color:#72b894;box-shadow:0 0 0 3px #e2f4e8}.send{min-width:84px;border:0;border-radius:12px;color:#fff;background:var(--accent);font-weight:700}.send:hover{background:var(--accent-dark)}.send:disabled{cursor:wait;opacity:.55}.composer-foot{display:flex;justify-content:space-between;gap:10px;max-width:760px;margin:8px auto 0;color:var(--muted);font-size:10px}.clear{padding:0;border:0;color:var(--accent-dark);background:transparent;font-size:11px}.status{min-height:17px;color:#a34c44;font-size:11px;text-align:center}.privacy{padding:0 20px 18px;color:#8b958f;font-size:10px;text-align:center;background:#fff}.privacy a{color:var(--accent-dark)}
    @media(max-width:620px){.shell{width:100%;padding:0}.app{height:100vh;min-height:100vh;border:0;border-radius:0}.header-note{display:none}.messages{padding:18px 13px}.welcome{margin:8px auto 24px;padding:20px 15px}.welcome h1{font-size:21px}.bubble{max-width:calc(100vw - 85px)}.composer{padding:11px 12px 13px}.composer-row{gap:6px}.send{min-width:64px}.composer-foot{font-size:9px}}
    .app{grid-template-rows:auto minmax(0,1fr) auto auto}.retry{margin-left:8px;border:0;padding:0;color:var(--accent-dark);background:transparent;text-decoration:underline}.send:disabled{cursor:default}.chips button:focus-visible,.clear:focus-visible,.send:focus-visible{outline:3px solid #77b89c;outline-offset:3px}@media(max-width:620px){.app{height:100dvh;min-height:0}.shell{min-height:100dvh}}
    .shell{width:min(1240px,calc(100% - 28px));display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);gap:16px;align-content:center;align-items:stretch}
    .reply-training{margin:5px 0 0;color:var(--accent-dark);font-size:11px;border:0;background:transparent;padding:4px 0;text-decoration:underline}
    .training-panel{min-width:0;min-height:0;max-height:max(620px,min(820px,calc(100vh - 56px)));overflow:auto;border:1px solid var(--line);border-radius:24px;padding:22px;background:var(--panel);box-shadow:var(--shadow)}
    .training-panel h2{margin:0;font-size:19px}.training-panel p{margin:6px 0;color:var(--muted);font-size:12px}
    .training-panel label,.training-label{display:block;margin:14px 0 5px;font-size:13px;font-weight:700}
    .training-panel textarea,.training-panel select{display:block;width:100%;padding:8px 10px;border:1px solid #cddbd1;border-radius:9px;background:#fbfdfb;color:var(--ink)}
    .training-panel textarea{resize:vertical}.training-panel select{font:inherit;font-size:13px}
    .training-original{max-height:140px;overflow:auto;padding:8px 10px;border-radius:9px;background:var(--paper);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
    .training-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.training-actions .send{padding:7px 12px}
    @media(max-width:780px){.shell{grid-template-columns:minmax(0,1fr);align-content:start;gap:10px}.app{height:72dvh;min-height:360px}.training-panel{max-height:none}}
    @media(max-width:620px){.shell{width:100%}.training-panel{border-radius:0;padding:18px 15px}}
    @media(prefers-reduced-motion:reduce){.typing i{animation:none}}
  </style>
</head>
<body>
  <main class="shell"><section class="app" aria-label="OE DESK 在线客服">
    <header><div class="brand"><div class="mark">OE</div><div><strong>OE DESK</strong><span>AI CUSTOMER SERVICE</span></div></div><div class="header-note"><b>在线咨询</b><span>AI 会结合当前对话连续回答</span></div></header>
    <section class="messages" id="messages" aria-live="polite"><div class="welcome" id="welcome"><h1>您好，想咨询什么？</h1><p>可以直接描述产品、升级需求、订单或售后问题，我会结合上下文继续帮您处理。</p><div class="chips"><button class="chip" type="button" data-prompt="我想升级刹车，有什么建议？">升级刹车</button><button class="chip" type="button" data-prompt="我想了解减震产品。">了解减震</button><button class="chip" type="button" data-prompt="我的订单需要售后处理。">订单售后</button></div></div></section>
    <form class="composer" id="composer"><div class="composer-row"><textarea id="question" aria-label="咨询内容" rows="1" maxlength="1200" placeholder="输入您的问题…" autocomplete="off"></textarea><button class="send" id="send" type="submit">发送</button></div><div class="composer-foot"><span>Enter 发送 · Shift + Enter 换行</span><button class="clear" id="clear" type="button">新对话</button></div><div class="status" id="status" role="status"></div></form><div class="privacy">对话会发送给 AI 服务处理，刷新页面即清除本机记录。请勿提交敏感信息。</div>
  </section>
  <aside class="training-panel" id="training-panel" aria-labelledby="training-title">
    <form id="training-form">
      <h2 id="training-title">客服训练场</h2>
      <label for="training-turn">当前对话</label>
      <select id="training-turn">
        <option value="latest">跟随最新一轮</option>
        <option value="manual">手动新增问答</option>
      </select>
      <p id="training-state" role="status">发送问题后，这里会显示 AI 的回复。</p>
      <div id="training-original-group" hidden>
        <div class="training-label">AI 原回复</div>
        <div class="training-original" id="training-original" tabindex="0" aria-label="AI 原回复"></div>
      </div>
      <label for="training-question">客户问法</label>
      <textarea id="training-question" rows="2" maxlength="600" required></textarea>
      <label for="training-answer">训练答复</label>
      <textarea id="training-answer" rows="6" maxlength="2000" required aria-describedby="training-privacy"></textarea>
      <p id="training-privacy">保存后进入待审核列表。请去除姓名、订单号和联系方式。</p>
      <p id="training-result" role="status"></p>
      <div class="training-actions">
        <button class="clear" type="button" id="training-test">测试这个问法</button>
        <button class="send" type="submit" id="training-submit">保存训练内容</button>
      </div>
    </form>
  </aside>
  </main>
  <script src="chat-config.js"></script>
  <script src="chat.js?v=training-2" defer></script>
</body>
</html>
